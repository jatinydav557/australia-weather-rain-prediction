<!DOCTYPE html>
<html>
<head>
    <title>Rain Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            min-width: 200px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"] {
            padding: 8px;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }

        .center {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>Rain Prediction Form</h1>

    <form method="POST">
        {% for feature in features %}
        <div class="form-group">
            <label for="{{ feature }}">{{ feature }}</label>
            <input type="text" name="{{ feature }}" id="{{ feature }}" value="{{ request.form.get(feature, '') }}" required>
        </div>
        {% endfor %}
        <div class="form-group" style="align-self: flex-end;">
            <button type="submit">Predict</button>
        </div>
    </form>

    {% if prediction %}
    <div class="center">
        <strong>Prediction:</strong> {{ prediction }}
    </div>
    {% endif %}
</body>
</html>
